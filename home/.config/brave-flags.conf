# Hardware video decoding (VA-API through libva-nvidia-driver on the RTX) instead of the CPU.
# Check in brave://gpu ("Video Decode: Hardware accelerated"). If video breaks, delete this file.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
